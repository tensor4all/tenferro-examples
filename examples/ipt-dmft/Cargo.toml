[package]
name = "ipt_dmft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Mott transition of the Bethe-lattice Hubbard model with DMFT and the IPT solver, on tenferro FFTs"

[dependencies]
tenferro-cpu.workspace = true
tenferro-fft.workspace = true
tenferro-runtime.workspace = true
tenferro-tensor.workspace = true
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "line_series",
] }
