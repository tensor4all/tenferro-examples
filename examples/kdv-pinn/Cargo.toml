[package]
name = "kdv_pinn"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Physics-informed neural network for the KdV equation with tenferro traced autodiff"

[dependencies]
tenferro-ad.workspace = true
tenferro-cpu.workspace = true
tenferro-runtime.workspace = true
tenferro-tensor.workspace = true
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "bitmap_gif",
    "line_series",
] }
rand = "0.8"
