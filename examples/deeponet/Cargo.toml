[package]
name = "deeponet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "DeepONet for the antiderivative operator, trained with tenferro traced autodiff"

[dependencies]
sciml-kit.workspace = true
tenferro-ad.workspace = true
tenferro-cpu.workspace = true
tenferro-linalg.workspace = true
tenferro-runtime.workspace = true
tenferro-tensor.workspace = true
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "line_series",
] }
rand = "0.8"
