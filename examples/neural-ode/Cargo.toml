[package]
name = "neural_ode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Neural ODE with a checkpointed RK4 discrete adjoint, trained with tenferro autodiff"

[dependencies]
sciml-kit.workspace = true
tenferro-ad.workspace = true
tenferro-cpu.workspace = true
tenferro-runtime.workspace = true
tenferro-tensor.workspace = true
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "line_series",
] }
rand = "0.8"
