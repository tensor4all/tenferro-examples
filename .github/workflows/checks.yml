name: checks

# Reusable job run by ci.yml (released tenferro) and upstream-main.yml
# (tenferro-rs main branch).
on:
  workflow_call:
    inputs:
      tenferro:
        description: "`release` uses the versions pinned in Cargo.toml; `main` uses the tenferro-rs main branch."
        type: string
        default: release

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test, short runs (${{ inputs.tenferro }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Point tenferro crates at tenferro-rs main
        if: inputs.tenferro == 'main'
        run: |
          sed -i -E 's#^(tenferro-[a-z-]+) = "[^"]+"#\1 = { git = "https://github.com/tensor4all/tenferro-rs", branch = "main" }#' Cargo.toml
          grep '^tenferro-' Cargo.toml
          echo "LOCKED=" >> "$GITHUB_ENV"

      - name: Use the committed lockfile
        if: inputs.tenferro != 'main'
        run: echo "LOCKED=--locked" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: tenferro-${{ inputs.tenferro }}

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy $LOCKED --workspace --all-targets --release -- -D warnings

      - name: cargo test
        run: cargo test $LOCKED --workspace --release

      - name: Short runs
        run: |
          mkdir -p outputs
          cargo run $LOCKED --release -p kdv_pinn -- --epochs 20 \
            --loss-png outputs/kdv-pinn-loss.png --gif outputs/kdv-pinn.gif
          cargo run $LOCKED --release -p neural_ode -- --epochs 20 \
            --plot outputs/neural-ode.png
          cargo run $LOCKED --release -p deeponet -- --epochs 100 \
            --plot outputs/deeponet.png
          cargo run $LOCKED --release -p pinn_gauss_newton -- --dim 1 --optimizer lm \
            --epochs 5 --plot outputs/pinn-gauss-newton.png
          cargo run $LOCKED --release -p pinn_gauss_newton -- --dim 2 --optimizer lm \
            --epochs 3
          cargo run $LOCKED --release -p pinn_gauss_newton -- --dim 2 --optimizer adam \
            --epochs 5
          cargo run $LOCKED --release -p nqs_rbm -- --system ising-chain --size 8 \
            --steps 100 --samples 256 --validation-sweeps 256 --exact \
            --output-dir outputs/nqs-ising-chain \
            --energy-png outputs/nqs-ising-chain-energy.png \
            --filters-png outputs/nqs-ising-chain-filters.png
          cargo run $LOCKED --release -p nqs_rbm -- --system heisenberg-chain --size 8 \
            --steps 100 --samples 256 --validation-sweeps 256 --exact
          cargo run $LOCKED --release -p nqs_rbm -- --system heisenberg-square --size 4 \
            --alpha 2 --steps 20 --samples 128 --validation-sweeps 128 \
            --filters-png outputs/nqs-heisenberg-square-filters.png
          cargo run $LOCKED --release -p ipt_dmft -- --n-matsubara 512 --iterations 500 \
            --plot outputs/ipt-dmft.png

      - uses: actions/upload-artifact@v7
        with:
          name: example-outputs-${{ inputs.tenferro }}
          path: outputs/
          if-no-files-found: error
