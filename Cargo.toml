[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# tenferro crates used by the examples. CI builds against these released
# versions; `.github/workflows/upstream-main.yml` replaces them with the
# tenferro-rs `main` branch to catch breakage before the next release.
[workspace.dependencies]
# Shared model/optimizer code for the SciML examples (see crates/sciml-kit).
sciml-kit = { path = "crates/sciml-kit" }
tenferro-ad = "0.11.0"
tenferro-cpu = "0.11.0"
tenferro-fft = "0.11.0"
tenferro-linalg = "0.11.0"
tenferro-runtime = "0.11.0"
tenferro-tensor = "0.11.0"
